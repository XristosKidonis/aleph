name: Versión web de prueba

# Publica la app en GitHub Pages cada vez que cambia main, para probarla en el navegador
# sin instalar nada: https://xristoskidonis.github.io/chi-ro-heirs/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Caché de las fuentes bíblicas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: datos/fuentes
          key: fuentes-${{ hashFiles('herramientas/construir_datos.py') }}

      - name: Construir la base bíblica
        run: python herramientas/construir_datos.py
        env:
          PYTHONUTF8: '1'

      - name: Dependencias
        run: npm ci

      - name: Compilar la versión web
        run: npx vite build
        env:
          WEB: '1'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
